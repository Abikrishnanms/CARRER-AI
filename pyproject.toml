[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "job-intelligence-platform"
version = "1.0.0"
description = "AI-Powered Job Intelligence Platform — Enterprise-grade microservices"
requires-python = ">=3.12"
license = { text = "MIT" }

[tool.uv.workspace]
members = [
    "services/gateway",
    "services/collector",
    "services/cleaner",
    "services/deduplicator",
    "services/verifier",
    "services/enrichment",
    "services/embedder",
    "services/search",
    "services/auth",
    "services/notifier",
    "services/analytics",
    "services/feedback",
    "services/orchestrator",
    "shared",
]

[tool.ruff]
line-length = 100
target-version = "py312"
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["services", "shared"]
omit = ["*/tests/*", "*/migrations/*"]
