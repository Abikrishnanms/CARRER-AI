name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  UV_VERSION: "0.4.0"

jobs:
  # ─── Lint & Format ──────────────────────────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}

      - name: Install lint dependencies
        run: uv pip install --system ruff mypy

      - name: Run Ruff (lint + format check)
        run: |
          ruff check .
          ruff format --check .

      - name: Run mypy (type checking)
        run: mypy shared/ services/gateway/ --ignore-missing-imports --no-strict-optional
        continue-on-error: true  # Non-blocking for now

  # ─── Unit Tests ─────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system \
            pytest pytest-asyncio pytest-cov httpx \
            fastapi motor pydantic aiokafka redis \
            langchain-core

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v \
            --cov=services --cov=shared \
            --cov-report=xml --cov-report=term-missing \
            -x
        env:
          APP_ENV: test
          MONGO_URI: mongodb://localhost:27017/jobplatform_test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: unit-tests
        continue-on-error: true

  # ─── Integration Tests ───────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: test-unit

    services:
      mongodb:
        image: mongo:7
        env:
          MONGO_INITDB_ROOT_USERNAME: admin
          MONGO_INITDB_ROOT_PASSWORD: admin123
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval \"db.adminCommand('ping')\""
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: pip install uv==${{ env.UV_VERSION }}

      - name: Install dependencies
        run: |
          uv pip install --system \
            pytest pytest-asyncio httpx \
            fastapi uvicorn motor pydantic \
            aiokafka redis pyjwt

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v --timeout=30
        env:
          APP_ENV: test
          MONGO_URI: mongodb://admin:admin123@localhost:27017/jobplatform_test?authSource=admin
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: test-secret-key-for-ci

  # ─── Docker Build ────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [test-unit]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/docker/Dockerfile.gateway
          push: false
          tags: talentlens/gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
