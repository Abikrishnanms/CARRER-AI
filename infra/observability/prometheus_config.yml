global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'talentlens-prod'
    env: 'production'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gateway:8000']
    relabel_configs:
      - source_labels: [__address__]
        target_label: service
        replacement: 'gateway'

  - job_name: 'workers'
    static_configs:
      - targets:
          - 'collector:9090'
          - 'cleaner:9091'
          - 'deduplicator:9092'
          - 'enrichment:9093'
          - 'verifier:9094'
          - 'embedder:9095'
          - 'notifier:9096'
          - 'orchestrator:9097'

  - job_name: 'redpanda'
    static_configs:
      - targets: ['redpanda:9644']
    metrics_path: '/metrics'

  - job_name: 'qdrant'
    static_configs:
      - targets: ['qdrant:6333']
    metrics_path: '/metrics'
