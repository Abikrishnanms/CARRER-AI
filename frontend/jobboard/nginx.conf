worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens off;

    # ─── Gzip (text asset compression) ────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_disable "msie6";
    gzip_types
        application/javascript
        application/json
        application/xml
        application/wasm
        text/css
        text/javascript
        text/plain
        text/xml
        image/svg+xml;

    # ─── API reverse proxy with caching ───────────────────────────────────────
    upstream api_upstream {
        server api:8000;
        keepalive 32;
    }

    map $request_uri $no_cache {
        default 0;
        ~*/jobs 0;
        ~*/analytics 0;
    }

    proxy_cache_path /var/cache/nginx/api
        levels=1:2
        keys_zone=api_cache:10m
        max_size=100m
        inactive=60m
        use_temp_path=off;

    server {
        listen 3000 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ─── Caching for static assets ────────────────────────────────────────
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires off;
        }

        location ~* \.(?:js|css|woff2?|ttf|otf|eot)$ {
            expires 7d;
            add_header Cache-Control "public, max-age=604800, immutable";
            access_log off;
            try_files $uri =404;
        }

        location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            access_log off;
            try_files $uri =404;
        }

        # ─── API proxy with optional short cache for analytics ────────────────
        location /api/ {
            proxy_pass http://api_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_read_timeout 60s;
            proxy_connect_timeout 5s;

            # 30s edge cache for analytics overview only
            location ~* /api/v1/analytics/overview$ {
                proxy_pass http://api_upstream;
                proxy_cache api_cache;
                proxy_cache_valid 200 30s;
                proxy_cache_valid 404 5s;
                proxy_cache_bypass $http_authorization;
                add_header X-Cache-Status $upstream_cache_status;
            }
        }

        # ─── SPA fallback ─────────────────────────────────────────────────────
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ─── Security headers ─────────────────────────────────────────────────
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    }
}