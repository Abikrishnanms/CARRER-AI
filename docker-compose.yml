###############################################################################
# AI-Powered Job Intelligence Platform — Docker Compose
# Single command: docker compose up -d
# All services + infrastructure in one file.
###############################################################################

# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  platform:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mongodb_data:
  redis_data:
  qdrant_data:
  elasticsearch_data:
  minio_data:
  redpanda_data:
  grafana_data:
  prometheus_data:
  mlflow_data:

services:

  # ─────────────────────────────────────────────────────────────────────────────
  # INFRASTRUCTURE LAYER
  # ─────────────────────────────────────────────────────────────────────────────

  # MongoDB — Primary database for unstructured data
  mongodb:
    image: mongo:7.0
    container_name: jip-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-jobplatform}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - platform
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis — Cache, sessions, rate limiting, pub/sub
  redis:
    image: redis:7-alpine
    container_name: jip-redis
    restart: unless-stopped
    # Use shell form so we can conditionally set --requirepass only when REDIS_PASSWORD is non-empty.
    # Passing --requirepass "" (empty string) breaks connectivity in some Redis 7 builds.
    command: ["sh", "-c", "redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - platform
    healthcheck:
      # Auth-aware healthcheck: use -a password if set, otherwise no-auth ping.
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a \"$REDIS_PASSWORD\"} ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Redpanda — Kafka-compatible message broker (no JVM!)
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: jip-redpanda
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --smp=1
      - --memory=512M
      - --overprovisioned
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=localhost:8082
      - --schema-registry-addr=0.0.0.0:8081
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    ports:
      - "9092:9092"
      - "8081:8081"
      - "8082:8082"
      - "9644:9644"
    networks:
      - platform
    healthcheck:
      # For single-node dev clusters, verify the broker process is actually listening for Kafka requests.
      # `rpk cluster health` can report unhealthy on 1-node clusters even when the broker is working,
      # so we fall back to: admin API HTTP check → rpk topic list → rpk cluster health (last resort).
      test: ["CMD-SHELL", "(curl -sf http://localhost:9644/v1/status >/dev/null 2>&1) || (rpk topic list >/dev/null 2>&1) || (rpk cluster health --watch=false 2>&1 | grep -q 'Healthy: true')"]
      interval: 10s
      timeout: 5s
      retries: 24
      start_period: 60s

  # Redpanda Console — Web UI for Kafka management
  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: jip-redpanda-console
    restart: unless-stopped
    environment:
      KAFKA_BROKERS: redpanda:29092
      SCHEMAREGISTRY_ENABLED: "true"
      SCHEMAREGISTRY_URLS: http://redpanda:8081
    ports:
      - "8080:8080"
    networks:
      - platform
    depends_on:
      - redpanda

  # Kafka Topic Initializer — creates all topics before services start
  kafka-init:
    image: python:3.12-slim
    container_name: jip-kafka-init
    restart: "no"
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
    networks:
      - platform
    depends_on:
      redpanda:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts
      - ./shared:/app/shared
    command: >
      /bin/sh -c "
      pip install aiokafka --quiet &&
      python /app/scripts/init_kafka_topics.py --bootstrap-servers redpanda:29092
      "

  # Qdrant — Vector database for semantic search
  qdrant:
    image: qdrant/qdrant:latest
    container_name: jip-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
      - ./infra/docker/qdrant/config.yaml:/qdrant/config/production.yaml
    ports:
      - "6333:6333"
      - "6334:6334"
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # Elasticsearch — Full-text search + analytics
  elasticsearch:
    image: elasticsearch:8.12.0
    container_name: jip-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
      - ELASTIC_PASSWORD=${ELASTICSEARCH_PASSWORD:-elastic_dev_password}
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"
    networks:
      - platform
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # MinIO — S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: jip-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - platform
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO bucket initialization
  minio-init:
    image: minio/mc:latest
    container_name: jip-minio-init
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - platform
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-minioadmin} ${MINIO_SECRET_KEY:-minioadmin123};
      mc mb local/resumes --ignore-existing;
      mc mb local/company-logos --ignore-existing;
      mc mb local/reports --ignore-existing;
      mc mb local/ml-models --ignore-existing;
      echo 'MinIO buckets created';
      "

  # ─────────────────────────────────────────────────────────────────────────────
  # PLATFORM SERVICES
  # ─────────────────────────────────────────────────────────────────────────────

  # API Gateway — Main entry point
  gateway:
    build:
      context: .
      dockerfile: infra/docker/gateway/Dockerfile
    container_name: jip-gateway
    restart: unless-stopped
    environment:
      - APP_ENV=development
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB:-jobplatform}?authSource=admin
      - REDIS_URL=redis://redis:6379/0
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - QDRANT_HOST=qdrant
      - ELASTICSEARCH_URL=http://elasticsearch:9200
      - MINIO_ENDPOINT=minio:9000
      - CORS_ORIGINS=http://localhost:3000,http://localhost:3001
      - SERVICE_NAME=gateway
    env_file:
      - .env
    ports:
      - "8000:8000"
    networks:
      - platform
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/gateway:/app/services/gateway
      - ./shared:/app/shared
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Job Collector Service
  collector:
    build:
      context: .
      dockerfile: infra/docker/collector/Dockerfile
    container_name: jip-collector
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - ADZUNA_API_ID=${ADZUNA_API_ID:-}
      - ADZUNA_API_KEY=${ADZUNA_API_KEY:-}
      - SERVICE_NAME=collector
    env_file:
      - .env
    networks:
      - platform
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/collector:/app/services/collector
      - ./shared:/app/shared

  # Data Cleaner Service
  cleaner:
    build:
      context: .
      dockerfile: infra/docker/cleaner/Dockerfile
    container_name: jip-cleaner
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB:-jobplatform}?authSource=admin
      - SERVICE_NAME=cleaner
    env_file:
      - .env
    networks:
      - platform
    depends_on:
      mongodb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/cleaner:/app/services/cleaner
      - ./shared:/app/shared

  # Deduplication Service
  deduplicator:
    build:
      context: .
      dockerfile: infra/docker/deduplicator/Dockerfile
    container_name: jip-deduplicator
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - REDIS_URL=redis://redis:6379/1
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB:-jobplatform}?authSource=admin
      - SERVICE_NAME=deduplicator
    env_file:
      - .env
    networks:
      - platform
    depends_on:
      redis:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/deduplicator:/app/services/deduplicator
      - ./shared:/app/shared

  # Verifier Service (Scam Detection + Authenticity)
  verifier:
    build:
      context: .
      dockerfile: infra/docker/verifier/Dockerfile
    container_name: jip-verifier
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB:-jobplatform}?authSource=admin
      - SERVICE_NAME=verifier
    env_file:
      - .env
    networks:
      - platform
    depends_on:
      mongodb:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/verifier:/app/services/verifier
      - ./shared:/app/shared
      - ./ml:/app/ml

  # Enrichment Service (Skills + Salary Extraction)
  enrichment:
    build:
      context: .
      dockerfile: infra/docker/enrichment/Dockerfile
    container_name: jip-enrichment
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB:-jobplatform}?authSource=admin
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - SERVICE_NAME=enrichment
    env_file:
      - .env
    networks:
      - platform
    depends_on:
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/enrichment:/app/services/enrichment
      - ./shared:/app/shared
      - ./ml:/app/ml

  # Embedding Service
  embedder:
    build:
      context: .
      dockerfile: infra/docker/embedder/Dockerfile
    container_name: jip-embedder
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - QDRANT_HOST=qdrant
      - EMBEDDING_MODEL=all-MiniLM-L6-v2
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB:-jobplatform}?authSource=admin
      - SERVICE_NAME=embedder
    env_file:
      - .env
    networks:
      - platform
    depends_on:
      qdrant:
        condition: service_healthy
      redpanda:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/embedder:/app/services/embedder
      - ./shared:/app/shared

  # Notification Service
  notifier:
    build:
      context: .
      dockerfile: infra/docker/notifier/Dockerfile
    container_name: jip-notifier
    restart: unless-stopped
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=redpanda:29092
      - MONGO_URI=mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin123}@mongodb:27017/${MONGO_DB:-jobplatform}?authSource=admin
      - SERVICE_NAME=notifier
    env_file:
      - .env
    networks:
      - platform
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    volumes:
      - ./services/notifier:/app/services/notifier
      - ./shared:/app/shared

  # ─────────────────────────────────────────────────────────────────────────────
  # FRONTEND
  # ─────────────────────────────────────────────────────────────────────────────

  # Public Job Board UI
  jobboard:
    build:
      context: ./frontend/jobboard
      dockerfile: Dockerfile
      target: development
    container_name: jip-jobboard
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_APP_NAME=Job Intelligence Platform
    ports:
      - "3000:3000"
    networks:
      - platform
    volumes:
      - ./frontend/jobboard/src:/app/src
    depends_on:
      - gateway

  # Admin Console
  admin:
    build:
      context: ./frontend/admin
      dockerfile: Dockerfile
      target: development
    container_name: jip-admin
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
      - VITE_APP_NAME=Job Platform Admin
    ports:
      - "3001:3001"
    networks:
      - platform
    volumes:
      - ./frontend/admin/src:/app/src
    depends_on:
      - gateway

  # ─────────────────────────────────────────────────────────────────────────────
  # OBSERVABILITY LAYER (LGTM Stack)
  # ─────────────────────────────────────────────────────────────────────────────

  # Prometheus — Metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: jip-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - platform

  # Grafana — Dashboards and visualization
  grafana:
    image: grafana/grafana:latest
    container_name: jip-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/observability/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./infra/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards
    ports:
      - "3002:3000"
    networks:
      - platform
    depends_on:
      - prometheus

  # MLflow — Model registry and experiment tracking
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    container_name: jip-mlflow
    restart: unless-stopped
    command: >
      mlflow server
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root s3://ml-models/mlflow
      --host 0.0.0.0
      --port 5000
    volumes:
      - mlflow_data:/mlflow
    environment:
      - AWS_ACCESS_KEY_ID=${MINIO_ACCESS_KEY:-minioadmin}
      - AWS_SECRET_ACCESS_KEY=${MINIO_SECRET_KEY:-minioadmin123}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
    ports:
      - "5000:5000"
    networks:
      - platform
    depends_on:
      minio:
        condition: service_healthy
