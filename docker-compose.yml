version: "3.8"

services:
  # ===== Our Database =====
  mongodb:
    image: mongo:7.0
    container_name: careerai-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: careerai
    volumes:
      - mongo_data:/data/db

  # ===== Web UI for MongoDB (NEW!) =====
  mongo-express:
    image: mongo-express:latest
    container_name: careerai-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin123
    depends_on:
      - mongodb

  # ===== Our Cache =====
  redis:
    image: redis:7.2-alpine
    container_name: careerai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # ===== Our Mailroom (RabbitMQ) =====
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: careerai-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

volumes:
  mongo_data: